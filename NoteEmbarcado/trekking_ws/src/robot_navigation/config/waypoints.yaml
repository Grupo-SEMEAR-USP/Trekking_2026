waypoint_navigator:
  ros__parameters:
    use_sim_time: true

    # Bases do losango (mesmas coordenadas do trekking_gazebo/worlds/trekking.sdf)
    waypoints_x: [0.0, 5.0, 0.0, -5.0]
    waypoints_y: [5.0, 0.0, -5.0, 0.0]
    waypoint_names: ["base_north", "base_east", "base_south", "base_west"]

    goal_tolerance: 0.35      # [m] raio de aceitação
    dwell_time: 1.0           # [s] parada sobre cada base
    loop: false

    # Tópicos da simulação (bridge em robot_gazebo/launch/spawn_robot.launch.py)
    odom_topic: /Margarete/odom
    imu_topic: /camera/imu/data
    cmd_vel_topic: /Margarete/cmd_vel
    frame_id: odom

    # Pose de spawn do robô no mundo (odom -> referencial das bases)
    origin_x: 0.0
    origin_y: 0.0
    origin_yaw: 0.0

    use_imu_heading: true
    align_imu_to_odom: true

    control_rate: 20.0
    data_timeout: 0.5
    max_linear_speed: 1.0
    min_linear_speed: 0.3
    slowdown_radius: 1.5
    reverse_speed: 0.4
    max_reverse_time: 4.0
    k_heading: 1.5

    # Geometria Ackermann (igual ao plugin no robot.urdf.xacro)
    wheel_base: 1.0
    max_steering_angle: 0.6
